[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustdesk-ai"
version = "0.1.0"
description = "Evidence-driven NLP intent classification baseline and FastAPI service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
